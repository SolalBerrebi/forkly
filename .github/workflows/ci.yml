name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # No `version:` — pnpm/action-setup reads the pinned version from the
      # `packageManager` field in package.json. Passing both can error with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Lint (eslint)
        run: pnpm lint

      - name: Build frontend (tsc + vite)
        run: pnpm build

      - name: Rustfmt check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

      # clippy compiles the crate, so this subsumes a separate `cargo check`.
      # `-D warnings` makes any lint a hard failure (no more continue-on-error).
      - name: Cargo clippy
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: ./src-tauri
        run: cargo test

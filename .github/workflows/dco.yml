name: DCO

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dco-check:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off on commits
        uses: tim-actions/dco@master

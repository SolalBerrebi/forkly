name: DCO

# Only on PRs — checking sign-off on a push to main is pointless (the PR was
# already gated) and false-fails on the unsigned merge commit GitHub creates.
on:
  pull_request:
    branches: [main]

jobs:
  dco-check:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependency-free check (the previous tim-actions/dco@master action was
      # unmaintained and started failing with "Unexpected end of JSON input").
      - name: Check Signed-off-by on all PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Missing 'Signed-off-by' on $sha — $(git show -s --format=%s "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Add a sign-off: commit with 'git commit -s', or fix existing commits with"
            echo "  git rebase --signoff ${BASE_SHA}..HEAD"
            exit 1
          fi
          echo "✓ All non-merge commits are signed off."

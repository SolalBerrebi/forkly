name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: 'macOS (Apple Silicon)'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: 'macOS (Intel)'
          - platform: ubuntu-22.04
            args: ''
            artifact: 'Linux'
          - platform: windows-latest
            args: ''
            artifact: 'Windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build & publish (${{ matrix.artifact }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ----- macOS code signing + notarization -----
          # tauri-action looks for these env vars on macOS runs and uses them
          # to sign the .app, package the .dmg, and submit to Apple's
          # notarization service. All are repo Secrets — set them in
          # Settings → Secrets and variables → Actions. Each Secret is
          # explained in docs/RELEASING.md.
          #
          # The certificate is a base64-encoded .p12 file of the
          # "Developer ID Application" cert exported from Keychain.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Apple ID + an app-specific password generated at
          # https://appleid.apple.com → Sign-In and Security → App-Specific
          # Passwords. NOT your real Apple ID password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Arbitrary password tauri-action uses for the temporary keychain
          # it imports the cert into. Any non-empty string is fine.
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

          # ----- Tauri auto-updater signing (optional) -----
          # If we later enable in-app updates via tauri-plugin-updater, the
          # updater needs a separate Ed25519 key pair. Until then these are
          # left unset and the updater is disabled.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Forkly ${{ github.ref_name }}'
          releaseBody: |
            See the [changelog](https://github.com/SolalBerrebi/forkly/blob/main/CHANGELOG.md)
            for what's in this release.

            Pick the asset below that matches your platform.

            **macOS users**: the `.dmg` is signed with our Developer ID cert
            and notarized by Apple. You can install it without right-click → Open.

            **Linux users**: pick the `.AppImage` for distro-agnostic install
            or the `.deb` for Debian/Ubuntu.

            **Windows users**: the `.msi` installer is unsigned in this
            release. Windows SmartScreen may warn — click "More info" → "Run anyway".
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

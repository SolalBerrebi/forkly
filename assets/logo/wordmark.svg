<?xml version="1.0" encoding="UTF-8"?>
<!--
  Forkly wordmark — mark + lowercase "forkly" in a Geist-Mono-style monospace.
  Drawn entirely as paths so it renders identically across systems without
  needing a font file. ~210x64 — works in README hero, GitHub social card,
  and product chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" width="264" height="64" fill="none">
  <defs>
    <linearGradient id="wm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>

  <!-- ============== Mark ============================================== -->
  <g transform="translate(0,0)">
    <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#wm-grad)"/>
    <rect x="2" y="2" width="60" height="30" rx="14" ry="14" fill="white" opacity="0.18"/>
    <path d="M 32 50 L 32 30" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 32 30 C 32 24, 22 22, 22 16" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 32 30 C 32 24, 42 22, 42 16" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="22" cy="16" r="3.5" fill="white"/>
    <circle cx="42" cy="16" r="3.5" fill="white"/>
    <circle cx="32" cy="50" r="3" fill="white" opacity="0.85"/>
  </g>

  <!-- ============== Wordmark =========================================
       Lowercase "forkly" in a geometric monospace, drawn as vectors so it
       displays the same on every system. Each character lives on a 22-unit
       grid (typical Geist-Mono advance width). -->
  <g
    transform="translate(80, 24)"
    font-family="'Geist Mono', 'JetBrains Mono', ui-monospace, monospace"
    font-size="22"
    font-weight="500"
    fill="currentColor"
    letter-spacing="-0.02em"
    style="font-feature-settings: 'ss01', 'cv11';"
  >
    <text dominant-baseline="middle" x="0" y="8">forkly</text>
  </g>
</svg>
